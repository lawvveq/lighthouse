<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign up — Lighthouse</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page">
    <div class="hero"></div>

    <main class="panel">
      <a class="logo" href="index.html">
        <svg class="logo__icon" viewBox="0 0 48 48" aria-hidden="true">
          <circle cx="24" cy="24" r="24" fill="#007AFF"/>
          <g fill="#fff">
            <path d="M21 15h6v3h-6z"/>
            <path d="M20 19h8l1.5 15h-11z"/>
            <path d="M16 35h16v2H16z"/>
            <path d="M23 12h2v2h-2z"/>
          </g>
          <g stroke="#fff" stroke-width="1.6" stroke-linecap="round">
            <path d="M18 15.5h-5M35 15.5h-5M18.5 12l-4-2.5M29.5 12l4-2.5M18.5 19l-4 2.5M29.5 19l4 2.5"/>
          </g>
          <path d="M19.6 24.5h8.8M19.2 28.5h9.6" stroke="#007AFF" stroke-width="1.4"/>
        </svg>
        <span class="logo__text">Lighthouse</span>
      </a>

      <h1 class="title">Create your account</h1>

      <form class="form" id="signup-form" novalidate>
        <div class="field">
          <label class="field__label" for="fullname">Full name</label>
          <div class="field__control">
            <input class="input" id="fullname" name="fullname" type="text" placeholder="Enter your full name" autocomplete="name" required>
          </div>
          <p class="field__error">Enter your full name</p>
        </div>
        <div class="field">
          <label class="field__label" for="email">Email</label>
          <div class="field__control">
            <input class="input" id="email" name="email" type="email" placeholder="Enter your email address" autocomplete="email" required>
          </div>
          <p class="field__error">Enter a valid email address</p>
        </div>
        <div class="field">
          <label class="field__label" for="password">Password</label>
          <div class="field__control">
            <input class="input input--password" id="password" name="password" type="password" placeholder="Create a password" autocomplete="new-password" required>
            <button class="eye" type="button" aria-label="Show password">
              <svg class="eye__on" viewBox="0 0 24 24" fill="currentColor"><path d="M12 5C7 5 2.7 8.1 1 12.5 2.7 16.9 7 20 12 20s9.3-3.1 11-7.5C21.3 8.1 17 5 12 5zm0 12.5a5 5 0 1 1 0-10 5 5 0 0 1 0 10zm0-8a3 3 0 1 0 0 6 3 3 0 0 0 0-6z"/></svg>
              <svg class="eye__off" viewBox="0 0 24 24" fill="currentColor"><path d="M12 7a5 5 0 0 1 5 5c0 .6-.1 1.3-.4 1.8l2.9 2.9c1.5-1.3 2.7-2.9 3.5-4.7C21.3 7.6 17 4.5 12 4.5c-1.4 0-2.7.3-4 .7l2.2 2.2c.5-.3 1.2-.4 1.8-.4zM2 4.3l2.3 2.3.4.4A11.8 11.8 0 0 0 1 12c1.7 4.4 6 7.5 11 7.5 1.5 0 3-.3 4.4-.8l.4.4 2.9 2.9 1.3-1.3L3.3 3 2 4.3zm5.5 5.5 1.6 1.6-.1.6a3 3 0 0 0 3 3l.6-.1 1.6 1.6A5 5 0 0 1 7.5 9.8zm4.3-.8 3.2 3.2V12a3 3 0 0 0-3-3h-.2z"/></svg>
            </button>
          </div>
          <p class="field__error">Use 8 or more characters</p>
        </div>
        <div class="field">
          <label class="field__label" for="confirm">Confirm password</label>
          <div class="field__control">
            <input class="input input--password" id="confirm" name="confirm" type="password" placeholder="Re-enter password" autocomplete="new-password" required>
            <button class="eye" type="button" aria-label="Show password">
              <svg class="eye__on" viewBox="0 0 24 24" fill="currentColor"><path d="M12 5C7 5 2.7 8.1 1 12.5 2.7 16.9 7 20 12 20s9.3-3.1 11-7.5C21.3 8.1 17 5 12 5zm0 12.5a5 5 0 1 1 0-10 5 5 0 0 1 0 10zm0-8a3 3 0 1 0 0 6 3 3 0 0 0 0-6z"/></svg>
              <svg class="eye__off" viewBox="0 0 24 24" fill="currentColor"><path d="M12 7a5 5 0 0 1 5 5c0 .6-.1 1.3-.4 1.8l2.9 2.9c1.5-1.3 2.7-2.9 3.5-4.7C21.3 7.6 17 4.5 12 4.5c-1.4 0-2.7.3-4 .7l2.2 2.2c.5-.3 1.2-.4 1.8-.4zM2 4.3l2.3 2.3.4.4A11.8 11.8 0 0 0 1 12c1.7 4.4 6 7.5 11 7.5 1.5 0 3-.3 4.4-.8l.4.4 2.9 2.9 1.3-1.3L3.3 3 2 4.3zm5.5 5.5 1.6 1.6-.1.6a3 3 0 0 0 3 3l.6-.1 1.6 1.6A5 5 0 0 1 7.5 9.8zm4.3-.8 3.2 3.2V12a3 3 0 0 0-3-3h-.2z"/></svg>
            </button>
          </div>
          <p class="field__error">Passwords do not match</p>
        </div>
        <p class="field__hint">Use 8 or more characters.</p>

        <label class="check" id="agree-label">
          <input type="checkbox" id="agree" name="agree">
          <span>I agree to the <a href="#">Terms of Service</a> and<br><a href="#">Privacy Policy</a>.</span>
        </label>

        <button class="btn btn--primary btn--submit" type="submit">Create account</button>
      </form>

      <hr class="divider">

      <button class="btn btn--dark js-google" type="button">
        <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.1H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 13 4 4 13 4 24s9 20 20 20 20-9 20-20c0-1.3-.1-2.6-.4-3.9z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2A11.9 11.9 0 0 1 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.1H42V20H24v8h11.3a12 12 0 0 1-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.6-.4-3.9z"/></svg>
        Or sign up with Google
      </button>

      <p class="switch-account">Already have an account?<a href="index.html">Sign in</a></p>

      <p class="footer">© Perfect Login 2021</p>
    </main>
  </div>

  <div class="toast" id="toast"></div>

  <script src="script.js"></script>
</body>
</html>
